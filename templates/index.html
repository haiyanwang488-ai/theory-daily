<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理论日课 · 中文理论文章聚合</title>
<style>
:root{
  --paper:#FBFAF7; --paper2:#F4F2ED; --line:#E3DFD6; --ink:#1C1B19;
  --ink2:#5A574F; --ink3:#8C887E; --accent:#8B2E2E; --blue:#1F3A5F;
  --serif:"Songti SC","SimSun","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}

/* ---------- 页头 ---------- */
.top{border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:30;backdrop-filter:saturate(1.1) blur(6px)}
.top-in{max-width:1180px;margin:0 auto;padding:16px 28px;display:flex;
  align-items:baseline;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:23px;letter-spacing:.14em;font-weight:600}
.brand em{font-style:normal;color:var(--accent)}
.sub{font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.18em;margin-left:2px}
.top-meta{margin-left:auto;font-size:12.5px;color:var(--ink3);letter-spacing:.04em}
.top-meta b{color:var(--ink2);font-weight:600}

/* ---------- 布局 ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 28px 80px;
  display:grid;grid-template-columns:196px minmax(0,1fr);gap:44px;align-items:start}
.side{position:sticky;top:76px;padding-top:30px;max-height:calc(100vh - 96px);overflow-y:auto}
.side::-webkit-scrollbar{width:4px}
.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.grp{font-size:11px;letter-spacing:.2em;color:var(--ink3);margin:22px 0 8px;
  text-transform:uppercase;font-weight:600}
.grp:first-child{margin-top:0}
.f{display:flex;justify-content:space-between;align-items:center;width:100%;
  background:none;border:0;border-radius:4px;padding:5px 8px;margin:1px 0;
  color:var(--ink2);text-align:left;font-size:13.5px;transition:.13s}
.f:hover{background:var(--paper2);color:var(--ink)}
.f.on{background:var(--ink);color:var(--paper);font-weight:600}
.f.on .n{color:rgba(251,250,247,.65)}
.f .n{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.f .dot{width:6px;height:6px;border-radius:50%;margin-right:7px;flex:none}
.f .lbl{display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- 工具条 ---------- */
.bar{position:sticky;top:73px;z-index:20;background:var(--paper);
  padding:22px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid transparent}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);
  border-radius:6px;background:#fff;font-size:14px;color:var(--ink);outline:none;transition:.15s}
.search input:focus{border-color:var(--ink3);box-shadow:0 0 0 3px rgba(140,136,126,.12)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:1.8}
select{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 10px;
  font-size:13px;color:var(--ink2);outline:none;cursor:pointer}
.tgl{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px;
  font-size:13px;color:var(--ink2);transition:.13s;white-space:nowrap}
.tgl:hover{border-color:var(--ink3)}
.tgl.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- 日期分隔 ---------- */
.day{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
.day h3{font-family:var(--serif);font-size:15px;font-weight:600;margin:0;letter-spacing:.06em;color:var(--ink)}
.day .cnt{font-size:11.5px;color:var(--ink3)}
.day .ln{flex:1;height:1px;background:var(--line)}

/* ---------- 卡片 ---------- */
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:16px 18px 13px;margin-bottom:11px;transition:.16s}
.card:hover{border-color:#D2CCBE;box-shadow:0 2px 14px rgba(28,27,25,.05)}
.card.read{opacity:.55;background:var(--paper)}
.card.read:hover{opacity:.85}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2.5px;
  border-radius:2px;background:var(--tc,#ccc);opacity:.85}
.card-top{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.tag{font-size:11px;padding:1.5px 7px;border-radius:3px;font-weight:600;letter-spacing:.03em;
  color:var(--tc,#666);background:color-mix(in srgb,var(--tc,#999) 9%,transparent)}
.src{font-size:11.5px;color:var(--ink3);letter-spacing:.03em}
.src::before{content:"·";margin-right:6px;color:var(--line)}
.card h2{font-family:var(--serif);font-size:17.5px;line-height:1.45;margin:0 0 6px;
  font-weight:600;letter-spacing:.012em}
.card h2 a{transition:.13s}
.card h2 a:hover{color:var(--accent)}
.abs{margin:0 0 10px;font-size:13.5px;line-height:1.72;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.abs.none{color:var(--ink3);font-style:italic;font-size:12.5px}
.card-foot{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--ink3)}
.card-foot .len{margin-right:auto;font-variant-numeric:tabular-nums}
.act{background:none;border:0;padding:2px 0;color:var(--ink3);font-size:11.5px;
  letter-spacing:.02em;transition:.13s;display:inline-flex;align-items:center;gap:3px}
.act:hover{color:var(--ink)}
.act.star.on{color:var(--accent);font-weight:600}
.empty{text-align:center;padding:80px 20px;color:var(--ink3);font-size:14px}
.empty .big{font-family:var(--serif);font-size:19px;color:var(--ink2);margin-bottom:8px}
.more{display:block;width:100%;margin:18px 0;padding:11px;border:1px dashed var(--line);
  background:none;border-radius:6px;color:var(--ink2);font-size:13px}
.more:hover{background:var(--paper2)}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
  background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:6px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink3);line-height:1.9}
.foot a{border-bottom:1px solid var(--line)}
.foot a:hover{color:var(--ink);border-color:var(--ink3)}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;gap:0;padding:0 16px 60px}
  .side{position:static;max-height:none;padding:14px 0 0;display:flex;flex-wrap:wrap;gap:4px}
  .grp{width:100%;margin:12px 0 4px}
  .f{width:auto;padding:4px 10px;border:1px solid var(--line);border-radius:20px}
  .top-in{padding:13px 16px}
  .brand{font-size:19px}
  .bar{top:0;padding:12px 0 10px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">理论<em>日课</em></div>
    <div class="sub">DAILY THEORY</div>
    <div class="top-meta">{{DATE}} ｜ 今日 <b>{{TODAY}}</b> 篇 ｜ 本周 <b>{{WEEK}}</b> 篇 ｜ 库内 <b>{{TOTAL}}</b> 篇</div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main>
    <div class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="搜索标题与摘要　按 / 聚焦" autocomplete="off">
      </div>
      <select id="range">
        <option value="all">全部时间</option>
        <option value="1">今日</option>
        <option value="3">近三日</option>
        <option value="7">近一周</option>
      </select>
      <select id="sort">
        <option value="date">按时间</option>
        <option value="source">按来源</option>
        <option value="len">按篇幅</option>
      </select>
      <button class="tgl" id="unread">仅未读</button>
    </div>
    <div id="feed"></div>
    <div class="foot">
      数据每日更新，内容版权归原媒体所有，本页仅提供标题、摘要与原文链接，供研究检索使用。<br>
      生成时间 {{GENERATED}} ｜ 快捷键：<b>/</b> 搜索　<b>Esc</b> 清空　<b>u</b> 切换未读筛选
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = /*__DATA__*/null;

const TOPIC_COLOR = {
  "马克思主义":"#8B2E2E","党史党建":"#A2402C","政治经济学":"#7A4A1E",
  "哲学":"#4A3F6B","法学":"#1F4A5F","政治学":"#2D4A6B",
  "国际":"#1F5F5A","军事国防":"#4A4A2D","历史":"#5C4A32","文化":"#7A3A5C",
  "新闻传播":"#3A5A3A","社会":"#4A5A2D","经济":"#8A5A1A",
  "科技教育":"#2A5A7A","生态":"#2F6B3F","其他":"#6B6B6B"
};
const STORE = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}") }catch(e){ return {} } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)) }
};
let read = STORE.get("td_read"), star = STORE.get("td_star");
let state = { topic:"全部", source:"全部", range:"all", sort:"date", q:"", unread:false, limit:60 };

const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayKey = d => d;
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

function dayLabel(d){
  const t = DATA.today;
  if(d === t) return "今日 · " + d;
  const y = new Date(Date.parse(t) - 864e5).toISOString().slice(0,10);
  if(d === y) return "昨日 · " + d;
  const dt = new Date(d + "T00:00:00");
  return d + " · " + WEEK[dt.getDay()];
}

/* ---------------- 侧栏 ---------------- */
function renderSide(){
  const t = DATA.topics.map(x =>
    `<button class="f${state.topic===x.name?" on":""}" data-k="topic" data-v="${esc(x.name)}">
       <span class="lbl"><i class="dot" style="background:${TOPIC_COLOR[x.name]||"#999"}"></i>${esc(x.name)}</span>
       <span class="n">${x.n}</span></button>`).join("");
  const s = DATA.sources.map(x =>
    `<button class="f${state.source===x.name?" on":""}" data-k="source" data-v="${esc(x.name)}">
       <span class="lbl">${esc(x.short)}</span><span class="n">${x.n}</span></button>`).join("");
  const tot = DATA.articles.length;
  $("#side").innerHTML = `
    <div class="grp">主题</div>
    <button class="f${state.topic==="全部"?" on":""}" data-k="topic" data-v="全部">
      <span class="lbl">全部</span><span class="n">${tot}</span></button>
    ${t}
    <div class="grp">来源</div>
    <button class="f${state.source==="全部"?" on":""}" data-k="source" data-v="全部">
      <span class="lbl">全部来源</span><span class="n">${tot}</span></button>
    ${s}
    <div class="grp">我的</div>
    <button class="f${state.topic==="★ 收藏"?" on":""}" data-k="topic" data-v="★ 收藏">
      <span class="lbl">★ 收藏</span><span class="n">${Object.keys(star).length}</span></button>
    <button class="f${state.unread?" on":""}" id="side-unread" data-k="unread">
      <span class="lbl">仅未读</span><span class="n">${tot - Object.keys(read).length}</span></button>`;
}

/* ---------------- 筛选 ---------------- */
function filtered(){
  const cutoff = state.range === "all" ? "0000-00-00"
    : new Date(Date.parse(DATA.today) - (parseInt(state.range)-1)*864e5).toISOString().slice(0,10);
  const q = state.q.trim().toLowerCase();
  let list = DATA.articles.filter(a => {
    if(a.pub_date < cutoff) return false;
    if(state.topic === "★ 收藏"){ if(!star[a.id]) return false; }
    else if(state.topic !== "全部" && a.topic !== state.topic) return false;
    if(state.source !== "全部" && a.source_name !== state.source) return false;
    if(state.unread && read[a.id]) return false;
    if(q && !(a.title.toLowerCase().includes(q) || (a.summary||"").toLowerCase().includes(q))) return false;
    return true;
  });
  if(state.sort === "source") list.sort((x,y)=> x.weight-y.weight || x.pub_date.localeCompare(y.pub_date));
  else if(state.sort === "len") list.sort((x,y)=> (y.chars||0)-(x.chars||0));
  else list.sort((x,y)=> y.pub_date.localeCompare(x.pub_date));
  return list;
}

/* ---------------- 列表 ---------------- */
function card(a){
  const tc = TOPIC_COLOR[a.topic] || "#6B6B6B";
  const abs = a.summary
    ? `<p class="abs">${esc(a.summary)}</p>`
    : `<p class="abs none">（该篇未取到摘要，点开原文阅读）</p>`;
  return `<article class="card${read[a.id]?" read":""}" data-id="${a.id}" style="--tc:${tc}">
    <div class="card-top">
      <span class="tag">${esc(a.topic)}</span>
      <span class="src">${esc(a.short)}</span>
    </div>
    <h2><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h2>
    ${abs}
    <div class="card-foot">
      <span class="len">${a.chars? a.chars.toLocaleString()+" 字" : "—"}</span>
      <button class="act star${star[a.id]?" on":""}" data-act="star">${star[a.id]?"★ 已收藏":"☆ 收藏"}</button>
      <button class="act" data-act="cite">复制引用</button>
      <button class="act" data-act="read">${read[a.id]?"标为未读":"标为已读"}</button>
      <a class="act" href="${esc(a.url)}" target="_blank" rel="noopener">原文 ↗</a>
    </div>
  </article>`;
}

function render(){
  const list = filtered();
  if(!list.length){
    $("#feed").innerHTML = `<div class="empty"><div class="big">没有符合条件的文章</div>
      <div>换个主题或清空搜索试试</div></div>`;
    return;
  }
  const show = list.slice(0, state.limit);
  let html = "", last = "";
  for(const a of show){
    if(state.sort === "date" && a.pub_date !== last){
      const n = list.filter(x=>x.pub_date===a.pub_date).length;
      html += `<div class="day"><h3>${dayLabel(a.pub_date)}</h3><span class="cnt">${n} 篇</span><span class="ln"></span></div>`;
      last = a.pub_date;
    }
    html += card(a);
  }
  if(list.length > show.length){
    html += `<button class="more" id="more">还有 ${list.length - show.length} 篇 · 继续加载</button>`;
  }
  $("#feed").innerHTML = html;
  const m = $("#more");
  if(m) m.onclick = () => { state.limit += 60; render(); };
}

/* ---------------- 交互 ---------------- */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1600);
}

function citation(a){
  const d = a.pub_date.replace(/-/g, "-");
  return `${a.title}[N/OL]. ${a.source_name}, ${d}. ${a.url}.`;
}

$("#feed").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const art = btn.closest(".card"); const id = art.dataset.id;
  const a = DATA.articles.find(x=>x.id===id);
  const act = btn.dataset.act;

  if(act === "star"){
    if(star[id]) delete star[id]; else star[id] = 1;
    STORE.set("td_star", star);
    btn.classList.toggle("on", !!star[id]);
    btn.textContent = star[id] ? "★ 已收藏" : "☆ 收藏";
    toast(star[id] ? "已收藏" : "已取消收藏");
    renderSide();
  }
  if(act === "read"){
    if(read[id]) delete read[id]; else read[id] = 1;
    STORE.set("td_read", read);
    art.classList.toggle("read", !!read[id]);
    btn.textContent = read[id] ? "标为未读" : "标为已读";
  }
  if(act === "cite"){
    const txt = citation(a);
    try{ await navigator.clipboard.writeText(txt); toast("引用已复制"); }
    catch(err){ window.prompt("复制引用：", txt); }
  }
});

$("#feed").addEventListener("click", e => {
  const link = e.target.closest("h2 a");
  if(!link) return;
  const art = link.closest(".card"); const id = art.dataset.id;
  if(!read[id]){
    read[id] = 1; STORE.set("td_read", read);
    art.classList.add("read");
    const b = art.querySelector('[data-act="read"]');
    if(b) b.textContent = "标为未读";
  }
});

$("#side").addEventListener("click", e => {
  const b = e.target.closest(".f"); if(!b) return;
  const k = b.dataset.k, v = b.dataset.v;
  if(k === "unread"){ state.unread = !state.unread; }
  else if(k){ state[k] = v; if(k==="topic"||k==="source") state.limit = 60; }
  renderSide(); render();
  $("#unread").classList.toggle("on", state.unread);
});

$("#q").addEventListener("input", e => { state.q = e.target.value; state.limit = 60; render(); });
$("#range").addEventListener("change", e => { state.range = e.target.value; state.limit = 60; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#unread").addEventListener("click", e => {
  state.unread = !state.unread;
  e.target.classList.toggle("on", state.unread);
  renderSide(); render();
});

document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
    if(e.key === "Escape"){ e.target.value = ""; state.q = ""; render(); e.target.blur(); }
    return;
  }
  if(e.key === "/"){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "u"){ $("#unread").click(); }
});

renderSide();
render();
</script>
</body>
</html>
