name: 理论日课 每日更新

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00 —— 抓取 + 推送（党报理论版多在上午 9 点后才齐）
    - cron: "0 2 * * *"
    # UTC 13:00 = 北京时间 21:00 —— 只补抓当天傍晚发布的新文章、刷新网页，不重复推送
    - cron: "0 13 * * *"
  workflow_dispatch: # 支持手动触发，方便调试
    inputs:
      force:
        description: "强制推送（忽略今天已推过的记录，仅用于首次验证）"
        type: boolean
        default: false

permissions:
  contents: write # 提交数据库
  pages: write # 部署网页
  id-token: write

concurrency:
  group: theory-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Chromium（解放日报、文汇报需要渲染）
        run: python -m playwright install --with-deps chromium

      - name: 抓取 · 生成 · 推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TZ: Asia/Shanghai
        run: |
          ARGS=""
          # 21:00 那次只刷新网页；push.py 内部还有「当天已推则跳过」兜底
          if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            ARGS="--no-push"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "执行: python morning.py $ARGS"
          python morning.py $ARGS

      - name: 提交数据库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theory.db
          if git diff --staged --quiet; then
            echo "数据库无变化，跳过提交"
          else
            git commit -m "data: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: daily
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
